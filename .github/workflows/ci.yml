name: public-omega-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11","3.12","3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Publication bootstrap validation
        run: python tools/validate_publication.py --mode bootstrap
      - name: Semantic registry validation
        run: python tools/validate_registry.py
      - name: Objectization slice validation
        run: python tools/validate_objectization04.py
      - name: Distribution compiler parity
        run: python tools/compile_distributions.py
      - name: Deployment packaging validation
        run: python tools/build_packages06.py --out build/package06
      - name: Aggregation 07A validation
        run: python tools/validate_aggregation07a.py
      - name: Upload deployment candidates
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-packages-v0.6
          path: build/package06/*.zip
          if-no-files-found: error
      - name: Aggregation 07A packaging
        run: python tools/build_packages07a.py --out build/package07a
      - name: Upload aggregation 07A candidates
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-packages-v0.7a
          path: build/package07a/*.zip
          if-no-files-found: error
      - name: Mount / kernel lattice 08A validation
        run: python tools/validate_mount_lattice08a.py
      - name: Mount / kernel lattice 08A packaging
        run: python tools/build_packages08a.py --out build/package08a
      - name: Upload mount / kernel lattice 08A candidates
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-packages-v0.8a
          path: build/package08a/*.zip
          if-no-files-found: error
      - name: Tier-A bind 08B validation
        run: python tools/validate_tier_a08b.py
      - name: Tier-A bind 08B packaging
        run: python tools/build_packages08b.py --out build/package08b
      - name: Upload Tier-A bind 08B candidates
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-packages-v0.8b
          path: build/package08b/*.zip
          if-no-files-found: error
      - name: Upload Tier-A 08B ChatGPT candidate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-chatgpt-v0.8b
          path: build/package08b/codexstation-omega-public-v0.8b.zip
          if-no-files-found: error
      - name: Upload Tier-A 08B Gemini candidate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-gemini-v0.8b
          path: build/package08b/codexstation-omega-public-gemini-v0.8b.zip
          if-no-files-found: error
      - name: Constitutional reference runtime 08C validation
        run: python tools/validate_runtime08c.py
      - name: Constitutional reference runtime 08C packaging
        run: python tools/build_packages08c.py --out build/package08c
      - name: Upload reference runtime 08C candidates
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-packages-v0.8c
          path: build/package08c/*.zip
          if-no-files-found: error
      - name: Upload reference runtime 08C ChatGPT candidate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-chatgpt-v0.8c
          path: build/package08c/codexstation-omega-public-v0.8c.zip
          if-no-files-found: error
      - name: Upload reference runtime 08C Gemini candidate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-public-gemini-v0.8c
          path: build/package08c/codexstation-omega-public-gemini-v0.8c.zip
          if-no-files-found: error

      - name: Tier-A integration harness 08D validation
        run: python tools/validate_integration08d.py

      - name: Tier-A independent reproduction 08E ledger validation
        run: python tools/validate_reproduction08e.py

      - name: Tier-A bridge 08F validation
        run: |
          python tools/verify_private_receipt08f.py
          python tools/validate_bridge08f.py

      - name: Tier-A receipt ingestion 08G validation
        run: |
          python tools/validate_ingestion08g.py
          python -m unittest -v tests.test_ingestion08g

      - name: Tier-A restricted runner pack 08H validation
        run: |
          python tools/validate_runner_pack08h.py
          python -m unittest -v tests.test_runner08h
          python tools/build_runner_pack08h.py --out build/runner08h
      - name: Upload runner pack 08H
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: codexstation-omega-runner-v0.8h
          path: build/runner08h/codexstation-omega-runner-v0.8h.zip
          if-no-files-found: error

      - name: Cybernetic control plane 09A validation
        run: |
          python tools/validate_cybernetic09a.py
          python -m unittest -v tests.test_cybernetic09a

      - name: Cybernetic mission compiler 09B validation
        run: |
          python tools/validate_cybernetic09b.py
          python -m unittest -v tests.test_cybernetic09b

      - name: Cybernetic skill orchestrator 09C validation
        run: |
          python tools/validate_cybernetic09c.py
          python -m unittest -v tests.test_cybernetic09c

      - name: Cybernetic adaptive policy 09D validation
        run: |
          python tools/validate_cybernetic09d.py
          python -m unittest -v tests.test_cybernetic09d

      - name: Cybernetic policy governor 09E validation
        run: |
          python tools/validate_cybernetic09e.py
          python -m unittest -v tests.test_cybernetic09e
